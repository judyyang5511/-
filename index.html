

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字火柴棒動腦遊戲｜棉花棒、牙籤也能玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<!-- 沿用原本的字體與樣式設定 -->
<style>
:root{
  --ink:#12343B; --teal:#028090; --orange:#E8552D; --amber:#F4A93C;
  --page:#EAF3F1; --panel:#FFFFFF; --line:#C9DCD8; --muted:#4F6A6E;
  --felt1:#1E4C54; --felt2:#12343B; --good:#1F9D6B; --warn:#E8552D;
  --round:"Huninn","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0E2226;--panel:#16323A;--line:#2A4B52;--muted:#A9C2C4;--ink:#EAF3F1}
}
:root[data-theme="dark"]{--page:#0E2226;--panel:#16323A;--line:#2A4B52;--muted:#A9C2C4;--ink:#EAF3F1}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
img,svg{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}

/* ---------- header ---------- */
header.top{padding:22px 0 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:54px;height:54px}
.logo h1{font-family:var(--round);font-weight:400;font-size:clamp(28px,3.6vw,42px);margin:0;line-height:1.1;letter-spacing:.02em}
.logo p{margin:2px 0 0;color:var(--muted);font-size:16px}
nav.tabs{display:flex;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px}
nav.tabs button{border:0;background:none;padding:10px 20px;border-radius:999px;font-family:var(--round);font-size:19px}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{background:var(--amber);color:#12343B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{background:var(--amber);color:#12343B}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(18px,3vw,40px);align-items:center;margin:26px 0 8px}
.hero .board{aspect-ratio:auto;padding:18px;cursor:pointer}
.hero h2{font-family:var(--round);font-weight:400;font-size:clamp(30px,3.4vw,46px);line-height:1.25;margin:0 0 12px}
.hero p{margin:0 0 14px;color:var(--muted);font-size:19px}
.hero .replay{font-size:15px;color:var(--muted)}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* ---------- settings ---------- */
.settings{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:14px 20px;margin:22px 0}
.settings .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.settings .lab{font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:17px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.seg svg{width:46px;height:16px}

/* ---------- bank ---------- */
.levels{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 18px;font-size:18px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
section.cat{margin:10px 0 34px}
.cathead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.cathead h3{font-family:var(--round);font-weight:400;font-size:30px;margin:0}
.cathead p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--teal)}
.tile .mini{border-radius:14px;padding:8px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.tile .mini svg{width:100%;height:100%}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.tile .task{font-weight:700;font-size:17px}
.stars{color:var(--amber);letter-spacing:1px;font-size:15px;white-space:nowrap}

/* ---------- board ---------- */
.board{border-radius:26px;background:radial-gradient(ellipse at 50% 28%,var(--felt1),var(--felt2) 72%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.05),inset 0 10px 40px rgba(0,0,0,.35);position:relative}
body.wood .board{background:
  repeating-linear-gradient(92deg,rgba(120,72,24,.06) 0 3px,transparent 3px 19px),
  repeating-linear-gradient(88deg,rgba(255,255,255,.18) 0 2px,transparent 2px 41px),
  linear-gradient(180deg,#EACFA2,#D9B783);box-shadow:inset 0 0 0 3px rgba(0,0,0,.05),inset 0 10px 30px rgba(90,50,10,.18)}
.board svg{display:block;width:100%;height:100%}
.dot{fill:rgba(255,255,255,.28)}
body.wood .dot{fill:rgba(80,45,10,.28)}
.stk{transition:transform .7s cubic-bezier(.34,1.25,.5,1)}
.stk .lift{transition:transform .2s ease,filter .2s ease}
.stk .halo{fill:none;stroke:var(--amber);stroke-width:5;opacity:0;transition:opacity .2s}
.stk.cheer .lift{animation:cheer .7s ease}
@keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.2) rotate(-6deg)}70%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
</style>
</head>
<body>
<!-- SVG 定義 (棉花棒、牙籤、火柴棒) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialgradient id="cotton" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".7" stop-color="#F4F7F8"></stop><stop offset="1" stop-color="#D9E3E6"></stop>
    </radialgradient>
    <lineargradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DDB0"></stop><stop offset="1" stop-color="#D9B06E"></stop>
    </lineargradient>
    <radialgradient id="mhead" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#F0654A"></stop><stop offset="1" stop-color="#B7301C"></stop>
    </radialgradient>
    <g id="stk-swab">
      <rect x="-32" y="-4.5" width="64" height="9" rx="4.5" fill="#FCFDFD" stroke="#B9C7CB" stroke-width="1.5"></rect>
      <ellipse cx="-33" cy="0" rx="12" ry="9.5" fill="url(#cotton)" stroke="#C4D1D5" stroke-width="1.5"></ellipse>
      <ellipse cx="33" cy="0" rx="12" ry="9.5" fill="url(#cotton)" stroke="#C4D1D5" stroke-width="1.5"></ellipse>
      <path d="M-40 -3 q4 -4 9 -3 M31 -4 q5 -2 9 1" stroke="#E3EAEC" stroke-width="1.5" fill="none"></path>
    </g>
    <g id="stk-pick">
      <path d="M-44 0 L-30 -4 L30 -4 L44 0 L30 4 L-30 4 Z" fill="url(#wood)" stroke="#A9793A" stroke-width="1.5" stroke-linejoin="round"></path>
      <path d="M-26 -1.2 H26" stroke="rgba(255,255,255,.45)" stroke-width="1.2"></path>
    </g>
    <g id="stk-match">
      <rect x="-43" y="-4.5" width="76" height="9" rx="2" fill="url(#wood)" stroke="#A9793A" stroke-width="1.5"></rect>
      <ellipse cx="33" cy="0" rx="12" ry="9" fill="url(#mhead)" stroke="#8E2415" stroke-width="1.5"></ellipse>
      <ellipse cx="30" cy="-3" rx="4" ry="2.2" fill="rgba(255,255,255,.35)"></ellipse>
    </g>
  </defs>
</svg>

<header class="top wrap">
  <div class="brandrow">
    <div class="logo">
      <svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="16" fill="#12343B"></rect>
        <g transform="translate(30 18) rotate(0) scale(.5)"><use href="#stk-swab"></use></g>
        <g transform="translate(19 31) rotate(90) scale(.3)"><use href="#stk-swab"></use></g>
        <g transform="translate(41 31) rotate(90) scale(.3)"><use href="#stk-swab"></use></g>
        <g transform="translate(30 44) rotate(-18) scale(.5)"><use href="#stk-match"></use></g></svg>
      <div><h1>漢字火柴棒遊戲</h1><p>移一根、加一根、拿一根，讓中文字大變身</p></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="bank">漢字題庫</button>
      <button role="tab" aria-selected="false" data-tab="custom">自由拼字</button>
      <button role="tab" aria-selected="false" data-tab="guide">帶領方法</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="tab-bank">
    <!-- 頂部展示區：日 -> 田 -->
    <div class="hero">
      <div class="board" id="heroBoard" style="height:clamp(200px,28vw,330px)">
        <svg viewBox="-46 -46 500 292">
          <!-- 「日」加一根變「田」的視覺展示 -->
          <g>
            <!-- 外框與橫豎 -->
            <g class="stk cheer" style="transform: translate(50px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(0px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(100px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(50px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(0px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(100px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(50px, 200px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            
            <!-- 變身箭頭符號 (簡化為兩根火柴) -->
            <g class="stk" style="transform: translate(220px, 100px) rotate(45deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk" style="transform: translate(220px, 100px) rotate(-45deg);"><g class="lift"><use href="#stk-swab"></use></g></g>

            <!-- 右側「田」 -->
            <g class="stk cheer" style="transform: translate(350px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(300px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(400px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(350px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(300px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(400px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(350px, 200px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(350px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
            <g class="stk cheer" style="transform: translate(350px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
          </g>
        </svg>
      </div>
      <div>
        <h2>「日」＋ 2 = 「田」？<br>加兩根變出新漢字</h2>
        <p>老師投影出題，長輩在桌上用棉花棒擺出同樣的漢字，一起動手、動腦找答案。</p>
        <p>也可以自由發揮，看誰能用最少的棒子拼出最多字！</p>
      </div>
    </div>

    <!-- 設定選項 -->
    <div class="settings">
      <div class="grp"><span class="lab">棒子</span>
        <div class="seg" id="styleSeg">
          <button data-style="swab" aria-pressed="true"><svg viewBox="-48 -12 96 24"><use href="#stk-swab"></use></svg>棉花棒</button>
          <button data-style="pick" aria-pressed="false"><svg viewBox="-48 -12 96 24"><use href="#stk-pick"></use></svg>牙籤</button>
          <button data-style="match" aria-pressed="false"><svg viewBox="-48 -12 96 24"><use href="#stk-match"></use></svg>火柴棒</button>
        </div>
      </div>
      <div class="grp"><span class="lab">桌面</span>
        <div class="seg" id="tableSeg">
          <button data-table="felt" aria-pressed="true">深色桌墊</button>
          <button data-table="wood" aria-pressed="false">木頭桌面</button>
        </div>
      </div>
    </div>

    <!-- 關卡難度標籤 -->
    <div class="levels" id="levelChips">
      <button class="chip" data-level="0" aria-pressed="true">全部題目</button>
      <button class="chip" data-level="1" aria-pressed="false">★ 入門：加一根</button>
      <button class="chip" data-level="2" aria-pressed="false">★★ 基礎：移一根</button>
      <button class="chip" data-level="3" aria-pressed="false">★★★ 挑戰：拿一根</button>
    </div>

    <!-- 題庫區塊 -->
    <div id="cats">
      <!-- 分類 1：加一根變新字 -->
      <section class="cat">
        <div class="cathead">
          <h3>加一根變新字</h3>
          <p>在原本的字加上一根棒子，讓它變成完全不同的字。</p>
        </div>
        <div class="tiles">
          <!-- 題目：「二」變「工」或「土」 -->
          <button class="tile" aria-label="加一根變新字：二變工">
            <div class="mini board">
              <svg viewBox="-46 -46 200 292">
                <g>
                  <g class="stk" style="transform: translate(50px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                </g>
              </svg>
            </div>
            <div class="meta"><span class="task">「二」加 1 根</span><span class="stars">★☆☆</span></div>
          </button>
          
          <!-- 題目：「口」變「日」或「中」 -->
          <button class="tile" aria-label="加一根變新字：口變日">
            <div class="mini board">
              <svg viewBox="-46 -46 200 292">
                <g>
                  <g class="stk" style="transform: translate(50px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(0px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(100px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                </g>
              </svg>
            </div>
            <div class="meta"><span class="task">「口」加 1 根 (提示:延伸或相交)</span><span class="stars">★☆☆</span></div>
          </button>
        </div>
      </section>

      <!-- 分類 2：移一根變新字 -->
      <section class="cat">
        <div class="cathead">
          <h3>移一根變新字</h3>
          <p>總棒子數不變，移動其中一根的位置拼出新字。</p>
        </div>
        <div class="tiles">
          <!-- 題目：「十」變「二」 (此處需兩根，假設移一根) 
               改為：「干」移一根變「土」或「士」 -->
          <button class="tile" aria-label="移一根變新字：干變土">
            <div class="mini board">
              <svg viewBox="-46 -46 200 292">
                <g>
                  <g class="stk" style="transform: translate(50px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                </g>
              </svg>
            </div>
            <div class="meta"><span class="task">「干」移 1 根</span><span class="stars">★★☆</span></div>
          </button>
          
          <!-- 題目：「田」移兩根變「口」 (簡化為移一根的題目，如「目」移一根變「日」與尾巴) 此處自由發揮 -->
          <button class="tile" aria-label="移一根變新字：木變本">
            <div class="mini board">
              <svg viewBox="-46 -46 200 292">
                <g>
                  <g class="stk" style="transform: translate(50px, 50px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(25px, 100px) rotate(45deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(75px, 100px) rotate(-45deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                </g>
              </svg>
            </div>
            <div class="meta"><span class="task">「木」移 1 根 (撇/捺)</span><span class="stars">★★☆</span></div>
          </button>
        </div>
      </section>

      <!-- 分類 3：拿一根變新字 -->
      <section class="cat">
        <div class="cathead">
          <h3>拿一根變新字</h3>
          <p>抽掉一根棒子，剩下的圖形會變成哪個字呢？</p>
        </div>
        <div class="tiles">
          <!-- 題目：「王」拿 1 根變「工」或「土」或「干」 -->
          <button class="tile" aria-label="拿一根變新字：王變土">
            <div class="mini board">
              <svg viewBox="-46 -46 200 292">
                <g>
                  <g class="stk" style="transform: translate(50px, 0px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 50px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 100px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 150px) rotate(90deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                  <g class="stk" style="transform: translate(50px, 200px) rotate(0deg);"><g class="lift"><use href="#stk-swab"></use></g></g>
                </g>
              </svg>
            </div>
            <div class="meta"><span class="task">「王」拿掉 1 根</span><span class="stars">★★★</span></div>
          </button>
        </div>
      </section>
    </div>
  </div>
</main>
</body>
</html>



Gemini 是 AI，有時可能會出錯。
